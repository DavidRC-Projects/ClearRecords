AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClearRecords API - Serverless Backend

Globals:
  Api:
    # Throttling configured via MethodSettings (see documentation)
    # Note: Throttling limits should be set via API Gateway usage plans in production
    Cors:
      AllowMethods: "'POST,GET,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: !If
        - IsDevelopment
        - "'*'"
        - !If
          - HasAllowedOrigins
          - !Sub "'${AllowedOrigins}'"
          - !Sub "''"  # BUG FIX: Empty string will cause CORS to fail (more secure than 'null' which allows file:// origins)
      MaxAge: "'300'"
    Auth:
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt CognitoUserPool.Arn
          Identity:
            Header: Authorization
            ValidationExpression: ^Bearer [-A-Za-z0-9._~+/]+=*$
      DefaultAuthorizer: CognitoAuthorizer
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
    # Enable X-Ray tracing for all functions
    Tracing: Active
    # CloudWatch Logs retention (30 days for compliance)
    LoggingConfig:
      LogGroup:
        RetentionInDays: 30

Resources:
  # Dead Letter Queue for Lambda error handling
  LambdaDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-lambda-dlq'
      MessageRetentionPeriod: 1209600  # 14 days (SECURITY: Consider reducing for sensitive data - DLQ contains error metadata, not patient data)
      KmsMasterKeyId: alias/aws/sqs  # Use AWS managed key

  # S3 Bucket for access logging (separate to avoid circular dependency)
  TempStorageLoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'clearrecords-logs-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90  # Keep logs for 90 days
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: ClearRecords
        - Key: Purpose
          Value: AccessLogs

  # S3 Bucket for temporary document storage
  TempStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'clearrecords-temp-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Suspended
      # Fix: ExpirationInDays must be >= 1 (AWS requirement)
      # Use 1 day minimum - objects deleted within 24 hours
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter1Day
            Status: Enabled
            ExpirationInDays: 1
            ExpiredObjectDeleteMarker: false
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      # Enable access logging for security audit (using separate logging bucket)
      LoggingConfiguration:
        DestinationBucketName: !Ref TempStorageLoggingBucket
        LogFilePrefix: 'temp-bucket-access-logs/'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Add tags for cost tracking and compliance
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: ClearRecords
        - Key: DataClassification
          Value: Temporary
        - Key: AutoDelete
          Value: 'true'

  # DynamoDB Table for feedback storage (optional)
  FeedbackTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-Feedback'
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: feedbackId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: feedbackId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
      SSESpecification:
        SSEEnabled: true
      # Enable point-in-time recovery for compliance
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # Add tags
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: ClearRecords
        - Key: DataClassification
          Value: AnonymizedFeedback

  # Cognito User Pool for authentication
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        # Custom attributes must be prefixed with "custom:"
        - Name: custom:hcpc_number
          AttributeDataType: String
          Required: false
          Mutable: true
      MfaConfiguration: ON  # SECURITY: Require MFA for healthcare data protection
      UserPoolTags:
        Environment: !Ref Environment
        Project: ClearRecords

  # Cognito User Pool Client (for mobile app)
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub '${AWS::StackName}-mobile-client'
      GenerateSecret: false  # Mobile apps don't use client secrets
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      AccessTokenValidity: 60  # 1 hour (in minutes)
      IdTokenValidity: 60  # 1 hour (in minutes)
      RefreshTokenValidity: 30  # 30 days (in days, not minutes)
      PreventUserExistenceErrors: ENABLED  # Security: prevent user enumeration

  # Health Check Function
  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/health/
      Handler: app.lambda_handler
      # Inherits globals but can override
      Timeout: 10  # Health checks should be fast
      MemorySize: 128  # Minimal memory for health check
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Events:
        HealthCheck:
          Type: Api
          Properties:
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE  # Health check should be public

  # Document Processing Function
  DocumentProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/document-processing/
      Handler: app.lambda_handler
      Timeout: 60  # Textract can take longer
      MemorySize: 1024  # More memory for processing
      # Add reserved concurrency to prevent resource exhaustion
      ReservedConcurrentExecutions: !Ref MaxConcurrency
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          S3_TEMP_BUCKET: !Ref TempStorageBucket
          # Note: AWS_REGION is automatically set by Lambda runtime
          ENVIRONMENT: !Ref Environment
          REQUIRE_AUTH: !Ref RequireAuth
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          S3_KEY_PREFIX: !Ref S3KeyPrefix
          VALIDATE_USER_OWNERSHIP: !Ref ValidateUserOwnership
          DYNAMODB_FEEDBACK_TABLE: !Ref FeedbackTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref TempStorageBucket
        # S3 delete permission (no managed policy, use inline)
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub 'arn:aws:s3:::${TempStorageBucket}/*'
        # Security: Textract doesn't support resource-level permissions
        # Note: Resource: '*' is required for Textract (AWS limitation)
        # Actions are restricted to only what's needed
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - textract:AnalyzeDocument
                - textract:DetectDocumentText
              Resource: '*'  # Textract doesn't support resource ARNs
              # Add condition to limit to specific region if possible
              Condition:
                StringEquals:
                  'aws:RequestedRegion': !Ref AWS::Region
        # Explicit CloudWatch Logs permission (granular, not full access)
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${DocumentProcessingFunction}*'
      Events:
        ProcessDocument:
          Type: Api
          Properties:
            Path: /process-document
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  # Audit Engine Function
  AuditEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/audit-engine/
      Handler: app.lambda_handler
      Timeout: 30
      MemorySize: 512
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          DYNAMODB_FEEDBACK_TABLE: !Ref FeedbackTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
      Policies:
        # SECURITY: DynamoDB read permission removed - not currently used (least privilege)
        # Add back if AuditEngineFunction needs to read from DynamoDB in future
        # CloudWatch Logs permission
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AuditEngineFunction}*'
      Events:
        AuditDocument:
          Type: Api
          Properties:
            Path: /audit
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  # Feedback Generator Function
  FeedbackGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/feedback-generator/
      Handler: app.lambda_handler
      Timeout: 30
      MemorySize: 512
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          DYNAMODB_FEEDBACK_TABLE: !Ref FeedbackTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
      Policies:
        # DynamoDB write permission (for optional feedback storage)
        - DynamoDBWritePolicy:
            TableName: !Ref FeedbackTable
        # CloudWatch Logs permission
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FeedbackGeneratorFunction}*'
      Events:
        GenerateFeedback:
          Type: Api
          Properties:
            Path: /generate-feedback
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  # SNS Topic for CloudWatch alarm notifications
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alarms'
      DisplayName: ClearRecords Alarms
      # SECURITY: SNS encryption is enabled by default with AWS managed keys
      # Note: SNS doesn't support KMS alias format in CloudFormation
      # For customer-managed keys, use full KMS key ARN (not implemented here for simplicity)

  # CloudWatch Alarm: Lambda Errors
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-lambda-errors'
      AlarmDescription: Alert when Lambda function errors exceed threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300  # 5 minutes
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref DocumentProcessingFunction
      AlarmActions:
        - !Ref AlarmNotificationTopic

  # CloudWatch Alarm: Lambda Throttles
  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-lambda-throttles'
      AlarmDescription: Alert when Lambda function is throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref DocumentProcessingFunction
      AlarmActions:
        - !Ref AlarmNotificationTopic

  # CloudWatch Alarm: Lambda Duration (high latency)
  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-lambda-duration'
      AlarmDescription: Alert when Lambda function takes too long
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 50000  # 50 seconds (close to 60s timeout)
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref DocumentProcessingFunction
      AlarmActions:
        - !Ref AlarmNotificationTopic

  # CloudWatch Alarm: Audit Engine Errors
  AuditEngineErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-audit-engine-errors'
      AlarmDescription: Alert when Audit Engine function errors exceed threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref AuditEngineFunction
      AlarmActions:
        - !Ref AlarmNotificationTopic

  # CloudWatch Alarm: Feedback Generator Errors
  FeedbackGeneratorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-feedback-generator-errors'
      AlarmDescription: Alert when Feedback Generator function errors exceed threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref FeedbackGeneratorFunction
      AlarmActions:
        - !Ref AlarmNotificationTopic

# Parameters for configuration
Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - development
    Description: Environment name (production or development)
  
  RequireAuth:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Require authentication for document processing
  
  AllowedOrigins:
    Type: String
    Default: ''
    Description: Comma-separated list of allowed CORS origins (MANDATORY in production - API will reject requests if empty)
  
  S3KeyPrefix:
    Type: String
    Default: ''
    Description: Expected S3 key prefix for document validation (e.g., 'uploads/')
  
  ValidateUserOwnership:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Validate that users can only access their own documents
  
  MaxConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Maximum concurrent executions for document processing function
  
  ApiBurstLimit:
    Type: Number
    Default: 200
    MinValue: 1
    Description: API Gateway burst limit (requests per second)
  
  ApiRateLimit:
    Type: Number
    Default: 100
    MinValue: 0.1
    Description: API Gateway rate limit (requests per second)

# Conditions
Conditions:
  IsDevelopment: !Equals [!Ref Environment, 'development']
  HasAllowedOrigins: !Not [!Equals [!Ref AllowedOrigins, '']]

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
  
  TempStorageBucketName:
    Description: S3 bucket for temporary document storage
    Value: !Ref TempStorageBucket
    Export:
      Name: !Sub '${AWS::StackName}-TempBucket'
  
  FeedbackTableName:
    Description: DynamoDB table for feedback storage
    Value: !Ref FeedbackTable
    Export:
      Name: !Sub '${AWS::StackName}-FeedbackTable'
  
  DocumentProcessingFunctionArn:
    Description: Document Processing Lambda Function ARN
    Value: !GetAtt DocumentProcessingFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DocumentProcessingFunction'
  
  DeadLetterQueueUrl:
    Description: Dead Letter Queue URL for failed Lambda invocations
    Value: !Ref LambdaDeadLetterQueue
    Export:
      Name: !Sub '${AWS::StackName}-DLQ'
  
  AlarmNotificationTopicArn:
    Description: SNS Topic ARN for CloudWatch alarm notifications
    Value: !Ref AlarmNotificationTopic
    Export:
      Name: !Sub '${AWS::StackName}-AlarmTopic'
  
  TempStorageLoggingBucketName:
    Description: S3 bucket for access logs
    Value: !Ref TempStorageLoggingBucket
    Export:
      Name: !Sub '${AWS::StackName}-LoggingBucket'
  
  AuditEngineFunctionArn:
    Description: Audit Engine Lambda Function ARN
    Value: !GetAtt AuditEngineFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AuditEngineFunction'

  FeedbackGeneratorFunctionArn:
    Description: Feedback Generator Lambda Function ARN
    Value: !GetAtt FeedbackGeneratorFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FeedbackGeneratorFunction'
  
  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'
  
  CognitoUserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'
  
  CognitoUserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt CognitoUserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolArn'